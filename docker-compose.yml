services:
  postgres:
    image: postgres:17-alpine
    container_name: fols-security-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fols
      POSTGRES_PASSWORD: fols_dev_password
      POSTGRES_DB: fols_security
    ports:
      - "5433:5432"
    volumes:
      - fols_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fols -d fols_security"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fols_postgres_data:
